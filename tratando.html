<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aquí Nomás — DEMO auto-refresh (segura)</title>
<style>
:root{--pri:#0b5cff;}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{flex:1 1 200px;padding:10px 12px;border-radius:999px;border:1px solid #e2e8f0}
.btn{border-radius:999px;border:1px solid transparent;padding:8px 12px;font-size:14px;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:#fff;color:#6b7280;border-color:#e2e8f0}
.btn.secondary{background:#e5edff;color:#1e40af}
.btn.mic{background:#fee2e2;color:#b91c1c}
.tiny{font-size:12px;color:#6b7280;margin-top:4px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.title{font-weight:700;margin-bottom:4px}
.title span{font-weight:600;color:#555}
.meta{font-size:12px;color:#566;margin-top:4px}
.ok{padding:8px 10px;background:#eef9f1;border:1px solid #cfead8;border-radius:10px;margin-bottom:12px;color:#145a32}
.err{padding:8px 10px;background:#fff3f3;border:1px solid #ffd2d2;border-radius:10px;margin-bottom:12px;color:#7a1a1a}
.badge{display:inline-block;padding:4px 8px;background:#eef3ff;border:1px solid #d7e3ff;color:#153a9b;border-radius:999px;font-size:12px;margin-right:6px}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#445}
.switch input{transform:scale(1.2)}
@media(max-width:600px){.row{flex-direction:column;align-items:stretch}.input{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ Aquí Nomás — DEMO auto-refresh (segura)</h1>
  <div id="status" class="ok" style="display:none"></div>
  <div id="error" class="err" style="display:none"></div>

  <div class="box">
    <div class="row">
      <input id="qall" class="input" placeholder="Ej: 'almorzar en recoleta', 'cerca', 'santa fe'"/>
      <button id="micBtn" class="btn mic" title="Dictar por voz">🎤</button>
      <button id="goBtn" class="btn">Buscar</button>
      <button id="clearBtn" class="btn ghost">Limpiar</button>
      <button id="locBtn" class="btn secondary" title="Usar mi ubicación">📍 Cerca</button>
      <button id="refreshBtn" class="btn">Actualizar datos</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="switch"><input id="autoChk" type="checkbox"/> Auto (15s)</label>
      <div class="tiny" id="srcHint"></div>
      <div class="tiny" id="tsHint" style="margin-left:auto;text-align:right"></div>
    </div>
    <div class="tiny" id="gpsHint" style="margin-top:6px;display:none"></div>
    <div class="tiny" id="intentHint" style="margin-top:6px;display:none"></div>
  </div>

  <div id="results" class="box"></div>
</div>

<script>
const CSV_FALLBACK="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
const STATUS=document.getElementById("status"),ERR=document.getElementById("error"),SRC=document.getElementById("srcHint"),TSH=document.getElementById("tsHint");
SRC.textContent="Fuente CSV: "+CSV_FALLBACK;
let DATA=[],IDX=[],USER_POS=null,NEAR=false,LOADED=false,refreshTimer=null;

// --- utilidades ---
function removeDiacritics(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function norm(s){return removeDiacritics(String(s||"").toLowerCase()).replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
function parseCSV(t){const r=t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));const h=r.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));return r.map(l=>Object.fromEntries(h.map((x,i)=>[x,l[i]||""])));}
function parseCoord(v){if(!v)return NaN;let s=String(v).replace(",",".");let n=parseFloat(s);if(!isFinite(n)){const d=s.replace(/[^0-9]/g,"");if(d.length>=7)n=parseInt(d,10)/1e6;}if(Math.abs(n)>180)n/=1e6;return n;}
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);const s1=Math.sin(dLat/2),s2=Math.sin(dLng/2);const A=s1*s1+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*s2*s2;return 2*R*Math.asin(Math.min(1,Math.sqrt(A)));}

// --- carga CSV robusta ---
async function loadCSV(retry=3){
  try{
    STATUS.style.display='block';ERR.style.display='none';STATUS.textContent='Cargando CSV…';
    const r=await fetch(CSV_FALLBACK+"&nocache="+Date.now(),{cache:"no-store"});const txt=await r.text();
    if(/^\s*<!doctype/i.test(txt))throw new Error("El enlace no devolvió CSV (HTML).");
    DATA=parseCSV(txt);
    IDX=DATA.map(row=>{const n=norm(row.nombre_local||row.nombre||row.local||"");const rub=norm(row.rubro||"");const kw=norm((row.keywords||"")+" "+n+" "+rub+" "+(row.barrio||""));const dirb=norm((row.direccion||"")+" "+(row.barrio||""));const lat=parseCoord(row.lat),lng=parseCoord(row.lng);return{nombre:n,rubro:rub,kw,dirbar:dirb,lat,lng};});
    LOADED=true;STATUS.textContent="CSV cargado OK · "+DATA.length+" filas.";TSH.textContent="Actualizado: "+new Date().toLocaleTimeString();
  }catch(e){
    if(retry>0){STATUS.textContent="Reintentando carga…";return loadCSV(retry-1);}
    ERR.style.display='block';STATUS.style.display='none';ERR.textContent="Error al leer CSV: "+(e.message||e);
  }
}

// --- geolocalización segura ---
function getGeoPosition(cb){
  if(!navigator.geolocation){USER_POS={lat:-34.6037,lng:-58.3816};document.getElementById('gpsHint').textContent="📍 Ubicación estimada: Centro BA (sin GPS)";return cb();}
  navigator.geolocation.getCurrentPosition(
    pos=>{USER_POS={lat:pos.coords.latitude,lng:pos.coords.longitude};document.getElementById('gpsHint').textContent="📍 Ubicación detectada";cb();},
    err=>{USER_POS={lat:-34.6037,lng:-58.3816};document.getElementById('gpsHint').textContent="📍 Ubicación estimada: Centro BA (sin permisos)";cb();},
    {enableHighAccuracy:true,timeout:7000}
  );
}

// --- reconocimiento de voz seguro ---
(function(){
  const b=document.getElementById('micBtn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){b.disabled=true;b.innerText='🎤—';b.title='Voz no soportada';return;}
  const rec=new SR();rec.lang='es-AR';rec.interimResults=false;rec.maxAlternatives=1;let active=false;
  b.addEventListener('click',()=>{if(active)return;try{rec.start();active=true;b.innerText='⏺️';}catch{}});
  rec.onresult=e=>{const t=e.results[0][0].transcript||'';document.getElementById('qall').value=t.trim();buscar();};
  rec.onerror=()=>{STATUS.style.display='block';STATUS.textContent='🎤 No se pudo usar micrófono.';};
  rec.onend=()=>{active=false;b.innerText='🎤';};
})();

// --- búsqueda simplificada ---
function buscar(){
  if(!LOADED){STATUS.textContent="Esperá que cargue el CSV…";return;}
  const q=document.getElementById('qall').value.trim().toLowerCase();
  const stop=["el","la","los","las","de","un","una","en","por","para","con","y","o"];
  const tokens=q.split(/\s+/).filter(x=>!stop.includes(x)&&x.length>2);
  const out=[];
  for(const [i,row] of DATA.entries()){
    const txt=norm([row.nombre_local,row.rubro,row.barrio,row.direccion].join(" "));
    if(tokens.every(t=>txt.includes(t)))out.push({row,dist:USER_POS?hav(USER_POS,{lat:parseCoord(row.lat),lng:parseCoord(row.lng)}):null});
  }
  render(out);
}

// --- render ---
function render(list){
  const box=document.getElementById('results');
  if(!list.length){box.innerHTML='<div class="tiny">Sin resultados.</div>';return;}
  box.innerHTML=list.map(o=>{
    const r=o.row;const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((r.direccion||"")+" "+(r.barrio||""))}`;
    const dist=(typeof o.dist==="number")?`<div class="meta">≈ ${o.dist.toFixed(2)} km</div>`:"";
    return `<div class="card">
      <div class="title">${r.nombre_local||"(sin nombre)"} — <span>${r.rubro||""}</span></div>
      <div>${r.direccion||""} ${r.barrio?`(${r.barrio})`:""}</div>
      ${dist}
      <div class="meta"><a href="${maps}" target="_blank">Cómo llegar</a></div>
    </div>`;
  }).join("");
}

// --- eventos UI ---
document.getElementById('goBtn').onclick=buscar;
document.getElementById('clearBtn').onclick=()=>{document.getElementById('qall').value='';document.getElementById('results').innerHTML='';};
document.getElementById('locBtn').onclick=()=>{getGeoPosition(()=>{buscar();});};
document.getElementById('refreshBtn').onclick=()=>{loadCSV();};
document.getElementById('autoChk').onchange=e=>{if(e.target.checked){loadCSV();refreshTimer=setInterval(loadCSV,15000);}else{clearInterval(refreshTimer);}};

// --- inicio ---
loadCSV();
</script>
</body>
</html>
