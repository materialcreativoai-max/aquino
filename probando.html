<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquí Nomás — probando (estable)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{flex:1 1 200px;padding:10px 12px;border-radius:999px;border:1px solid #e2e8f0}
.btn{border-radius:999px;border:1px solid transparent;padding:8px 12px;font-size:14px;cursor:pointer;background:#0b5cff;color:#fff}
.btn.ghost{background:#fff;color:#6b7280;border-color:#e2e8f0}
.btn.secondary{background:#e5edff;color:#1e40af}
.btn.mic{background:#fee2e2;color:#b91c1c}
.btn:disabled{opacity:.6;cursor:not-allowed}
.tiny{font-size:12px;color:#6b7280;margin-top:4px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.card .title{font-weight:600;margin-bottom:2px}
.card .title span{font-weight:400;color:#6b7280}
.card .meta{font-size:12px;color:#6b7280;margin-top:4px}
.empty{font-size:14px;color:#6b7280;padding:8px}
@media(max-width:600px){
  .row{flex-direction:column;align-items:stretch}
  .input{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ Aquí Nomás — probando (estable)</h1>

  <div class="box">
    <div class="row">
      <input id="q" class="input" placeholder="Ej: 'almorzar en Santa Fe', 'arreglo de cierres Caballito'">
      <button id="mic"   class="btn mic">🎤 Voz</button>
      <button id="go"    class="btn">Buscar</button>
      <button id="clear" class="btn ghost">Limpiar</button>
      <button id="near"  class="btn secondary">📍 Cerca (1 km)</button>
    </div>
    <div id="status" class="tiny"></div>
  </div>

  <div id="results" class="box"></div>
</div>

<script>
// ================== CONFIG ==================
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
const NEAR_RADIUS_KM = 1.0;

let DATA = [];   // filas ya parseadas
let POS  = null; // {lat,lng} del usuario

const $ = s => document.querySelector(s);
const qInput   = $("#q");
const statusEl = $("#status");
const resultsEl= $("#results");

// ================== HELPERS ==================
function setStatus(msg){
  statusEl.textContent = msg || "";
  console.log("[AQN]", msg);
}

function norm(t){
  return (t || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function parseCSV(txt){
  const rows = txt.trim()
    .split(/\r?\n/)
    .map(r => r.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
      .map(c => c.replace(/^"|"$/g,"")));
  const head = rows.shift()
    .map(h => h.trim().toLowerCase().replace(/\s+/g,"_"));
  return rows.map(r => {
    const o = {};
    head.forEach((h,i)=>{ o[h] = (r[i] || "").trim(); });
    return o;
  });
}

function parseCoord(v){
  if(!v) return NaN;
  let s = String(v).replace(",",".");
  let n = parseFloat(s);
  if(!isFinite(n)) return NaN;
  // si viene en microgrados (tipo -34567890)
  if(Math.abs(n) > 180) n = n / 1e6;
  return n;
}

function haversineKm(a,b){
  const R = 6371;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const s1 = Math.sin(dLat/2);
  const s2 = Math.sin(dLng/2);
  const A = s1*s1 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*s2*s2;
  return 2 * R * Math.asin(Math.min(1,Math.sqrt(A)));
}

function tokenize(str){
  const stop = ["en","por","sobre","de","la","el","los","las","un","una","y","cerca","al","del","para"];
  return norm(str)
    .split(/\s+/)
    .filter(t => t && !stop.includes(t) && t.length >= 3);
}

// ================== LOAD DATA ==================
async function loadData(){
  if(DATA.length) return;
  try{
    setStatus("Cargando comercios…");
    const res = await fetch(CSV_URL + "&nocache=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    const raw = parseCSV(txt);

    DATA = raw.map(r => {
      const keys = Object.keys(r);
      const findKey = (cands) => keys.find(k => cands.includes(k));
      const nameKey   = findKey(["nombre_local","nombre","comercio","local"]);
      const rubroKey  = findKey(["rubro","categoria","categoría"]);
      const barrioKey = findKey(["barrio","zona"]);
      const dirKey    = findKey(["direccion","dirección","calle"]);
      const latKey    = keys.find(k => k.includes("lat"));
      const lngKey    = keys.find(k => k.includes("lng") || k.includes("lon"));

      const name   = nameKey   ? r[nameKey]   : "";
      const rubro  = rubroKey  ? r[rubroKey]  : "";
      const barrio = barrioKey ? r[barrioKey] : "";
      const dir    = dirKey    ? r[dirKey]    : "";

      const lat = latKey ? parseCoord(r[latKey]) : NaN;
      const lng = lngKey ? parseCoord(r[lngKey]) : NaN;

      const text = norm([
        name, rubro, barrio, dir,
        r.tags || "", r.descripcion || "", r.descripcion_larga || ""
      ].join(" "));

      return { raw:r, name, rubro, barrio, dir, lat, lng, text };
    });

    setStatus("Datos cargados: " + DATA.length + " locales. Escribí o usá los botones.");
  }catch(e){
    console.error(e);
    setStatus("Error al cargar datos del Sheet.");
  }
}

// ================== QUERY PARSE ==================
function parseQuery(str){
  const s = str.trim();
  if(!s) return { intent:"", zone:"" };

  // detectar "en/por/sobre ..." al final
  const m = s.match(/\b(en|por|sobre)\b\s+(.+)$/i);
  if(m){
    const zone = m[2].trim();
    const intent = s.slice(0, m.index).trim();
    return { intent, zone };
  }
  return { intent:s, zone:"" };
}

// ================== FILTER ==================
function filterData(intentStr, zoneStr, onlyNear){
  const intentTokens = tokenize(intentStr);
  const zoneTokens   = tokenize(zoneStr);

  // si no hay nada útil en la frase, no devolvemos todo
  if(!intentTokens.length && !zoneTokens.length && !onlyNear){
    setStatus("Escribí algo más específico para buscar.");
    return [];
  }

  const out = [];

  for(const row of DATA){
    let ok = true;
    let distKm = null;

    // filtro por intención (qué quiero)
    if(intentTokens.length){
      const hits = intentTokens.filter(t => row.text.includes(t));
      if(hits.length === 0) ok = false;
    }

    if(!ok) continue;

    // filtro por zona (dónde)
    if(zoneTokens.length){
      const zoneText = norm((row.barrio || "") + " " + (row.dir || ""));
      const hitsZ = zoneTokens.filter(t => zoneText.includes(t));
      if(hitsZ.length === 0) ok = false;
    }

    if(!ok) continue;

    // distancia
    if(POS && !isNaN(row.lat) && !isNaN(row.lng)){
      distKm = haversineKm(POS, {lat:row.lat, lng:row.lng});
    }

    // modo "Cerca": solo los que estén dentro del radio
    if(onlyNear){
      if(distKm == null || distKm > NEAR_RADIUS_KM){
        continue; // descartado por estar lejos
      }
    }

    out.push({...row, distKm});
  }

  // orden: primero más cerca, después por nombre
  out.sort((a,b)=>{
    const da = (typeof a.distKm === "number") ? a.distKm : 9999;
    const db = (typeof b.distKm === "number") ? b.distKm : 9999;
    if(da !== db) return da - db;
    return a.name.localeCompare(b.name);
  });

  return out;
}

// ================== RENDER ==================
function render(list){
  if(!list.length){
    resultsEl.innerHTML = '<div class="empty">Sin resultados.</div>';
    return;
  }

  resultsEl.innerHTML = list.map(r=>{
    const maps = `https://www.google.com/maps/search/?api=1&query=${
      encodeURIComponent((r.dir || "") + " " + (r.barrio || ""))
    }`;
    const dist = (typeof r.distKm === "number")
      ? `<div class="meta">≈ ${r.distKm.toFixed(2)} km</div>`
      : "";

    return `
      <div class="card">
        <div class="title">${r.name || "(sin nombre)"} — <span>${r.rubro || ""}</span></div>
        <div>${r.dir || ""} ${r.barrio ? `(${r.barrio})` : ""}</div>
        ${dist}
        <div class="meta"><a href="${maps}" target="_blank">Cómo llegar</a></div>
      </div>
    `;
  }).join("");
}

// ================== ACCIONES ==================
async function doSearch(){
  await loadData();
  const raw = qInput.value;
  const {intent, zone} = parseQuery(raw);
  const res = filterData(intent, zone, false);
  render(res);
  if(res.length) setStatus("Resultados: " + res.length);
}

async function doNear(){
  await loadData();
  if(!navigator.geolocation){
    setStatus("Tu navegador no permite geolocalización.");
    return;
  }
  setStatus("Obteniendo ubicación…");
  navigator.geolocation.getCurrentPosition(pos=>{
    POS = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    const res = filterData("", "", true);
    render(res);
    setStatus("Locales cercanos (≤ 1 km): " + res.length);
  },err=>{
    console.warn(err);
    setStatus("No se pudo obtener la ubicación.");
  });
}

async function doVoice(){
  await loadData();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setStatus("Tu navegador no admite reconocimiento de voz.");
    return;
  }
  const rec = new SR();
  rec.lang = "es-AR";
  rec.start();
  setStatus("Escuchando…");
  rec.onresult = e=>{
    const txt = e.results[0][0].transcript;
    qInput.value = txt;
    rec.stop();
    doSearch();
    setStatus("Búsqueda por voz: " + txt);
  };
  rec.onerror = ()=>{
    setStatus("Error al escuchar.");
  };
}

// ================== EVENTOS ==================
$("#go").addEventListener("click", ()=>{ doSearch(); });
$("#clear").addEventListener("click", ()=>{
  qInput.value = "";
  resultsEl.innerHTML = "";
  setStatus("Buscador limpio. Escribí o usá Voz / Cerca.");
});
$("#near").addEventListener("click", ()=>{ doNear(); });
$("#mic").addEventListener("click", ()=>{ doVoice(); });
qInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") doSearch();
});

// carga inicial silenciosa
loadData();
setStatus("Listo. Esperando tu búsqueda.");
</script>
</body>
</html>
