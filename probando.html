<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aquí Nomás — DEMO intención mejorada</title>
<style>
:root{--pri:#0b5cff;}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{flex:1 1 200px;padding:10px 12px;border-radius:999px;border:1px solid #e2e8f0}
.btn{border-radius:999px;border:1px solid transparent;padding:8px 12px;font-size:14px;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:#fff;color:#6b7280;border-color:#e2e8f0}
.btn.secondary{background:#e5edff;color:#1e40af}
.btn.mic{background:#fee2e2;color:#b91c1c}
.tiny{font-size:12px;color:#6b7280;margin-top:4px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.title{font-weight:700;margin-bottom:4px}
.title span{font-weight:600;color:#555}
.meta{font-size:12px;color:#566;margin-top:4px}
.ok{padding:8px 10px;background:#eef9f1;border:1px solid #cfead8;border-radius:10px;margin-bottom:12px;color:#145a32;display:none}
.err{padding:8px 10px;background:#fff3f3;border:1px solid #ffd2d2;border-radius:10px;margin-bottom:12px;color:#7a1a1a;display:none}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#445}
.switch input{transform:scale(1.2)}
@media(max-width:600px){.row{flex-direction:column;align-items:stretch}.input{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ Aquí Nomás — DEMO intención mejorada</h1>
  <div id="status" class="ok"></div>
  <div id="error" class="err"></div>

  <div class="box">
    <div class="row">
      <input id="qall" class="input" placeholder="Ej: 'quiero almorzar en el centro', 'comprar libros', 'comer helados en microcentro'"/>
      <button id="micBtn" class="btn mic" title="Dictar por voz">🎤</button>
      <button id="goBtn" class="btn">Buscar</button>
      <button id="clearBtn" class="btn ghost">Limpiar</button>
      <button id="locBtn" class="btn secondary" title="Usar mi ubicación">📍 Cerca</button>
      <button id="refreshBtn" class="btn">Actualizar datos</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="switch"><input id="autoChk" type="checkbox"/> Auto (15s)</label>
      <div class="tiny" id="srcHint"></div>
      <div class="tiny" id="tsHint" style="margin-left:auto;text-align:right"></div>
    </div>
    <div class="tiny" id="gpsHint" style="margin-top:6px;display:none"></div>
  </div>

  <div id="results" class="box"></div>
</div>

<script>
// --- CONFIG ---
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
const STATUS=document.getElementById("status");
const ERR=document.getElementById("error");
const SRC=document.getElementById("srcHint");
const TSH=document.getElementById("tsHint");
SRC.textContent="Fuente CSV: "+CSV_URL;
let DATA=[],USER_POS=null,LOADED=false,refreshTimer=null;

// --- UTILES ---
function showStatus(m){STATUS.style.display=m?"block":"none";STATUS.textContent=m||"";}
function showError(m){ERR.style.display=m?"block":"none";ERR.textContent=m||"";}
function removeDiacritics(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function norm(s){return removeDiacritics(String(s||"").toLowerCase()).replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
function parseCSV(t){const r=t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));const h=r.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));return r.map(l=>Object.fromEntries(h.map((x,i)=>[x,l[i]||""])));}
function parseCoord(v){if(!v)return NaN;let s=String(v).replace(",",".");let n=parseFloat(s);if(!isFinite(n)){const d=s.replace(/[^0-9]/g,"");if(d.length>=7)n=parseInt(d,10)/1e6;}if(Math.abs(n)>180)n/=1e6;return n;}
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);const s1=Math.sin(dLat/2),s2=Math.sin(dLng/2);const A=s1*s1+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*s2*s2;return 2*R*Math.asin(Math.min(1,Math.sqrt(A)));}

// --- CARGA CSV ---
async function loadCSV(){
  try{
    showError("");showStatus("Cargando CSV…");
    const r=await fetch(CSV_URL+"&nocache="+Date.now(),{cache:"no-store"});
    const txt=await r.text();if(/^\s*<!doctype/i.test(txt))throw new Error("HTML en vez de CSV");
    const raw=parseCSV(txt);const barrios=new Set();
    DATA=raw.map(row=>{
      const nombre=row.nombre_local||row.nombre||row.local||"";
      const rubro=row.rubro||"",barrio=row.barrio||"",dir=row.direccion||"",kw=row.keywords||"";
      const lat=parseCoord(row.lat),lng=parseCoord(row.lng);
      const textNorm=norm([nombre,rubro,barrio,dir,kw].join(" "));
      const obj={row,nombre,rubro,barrio,dir,kw,lat,lng,textNorm,nombreNorm:norm(nombre),rubroNorm:norm(rubro),barrioNorm:norm(barrio),kwNorm:norm(kw)};
      if(obj.barrioNorm)barrios.add(obj.barrioNorm);
      return obj;
    });
    window._BARRIOS=Array.from(barrios);
    LOADED=true;showStatus("CSV cargado OK · "+DATA.length+" filas.");TSH.textContent="Actualizado: "+new Date().toLocaleTimeString();
  }catch(e){LOADED=false;showStatus("");showError("Error CSV: "+(e.message||e));}
}

// --- LÓGICA ---
const VERBOS=["comer","almorzar","comprar","buscar","necesito","arreglar","quiero"];
function detectBarrio(q){if(!window._BARRIOS)return"";if(q.includes("centro")&&!q.includes("microcentro")&&window._BARRIOS.includes("microcentro"))return"microcentro";for(const b of window._BARRIOS){if(q.includes(b))return b;}return"";}
function detectLocal(q){let m=null;for(const d of DATA){if(!d.nombreNorm)continue;if(q.includes(d.nombreNorm)){if(m&&m!==d)return null;m=d;}}return m;}
function tokenVariants(t){const v=new Set([t]);if(t.endsWith("s"))v.add(t.slice(0,-1));if(t.endsWith("es"))v.add(t.slice(0,-2));return[...v];}

function scoreRow(d,toks,hasVerb){
  let s=0;
  for(const t of toks){
    for(const v of tokenVariants(t)){
      if(d.nombreNorm.includes(v))s+=4;
      if(d.rubroNorm.includes(v))s+=hasVerb?6:3;
      if(d.kwNorm.includes(v))s+=hasVerb?5:2;
      if(d.textNorm.includes(v))s+=1;
    }
  }
  return s;
}

// --- BUSCAR ---
function buscar(fromText){
  if(!LOADED){showStatus("Esperá que cargue el CSV…");return;}
  const raw=(typeof fromText==="string"?fromText:document.getElementById('qall').value).trim();
  if(!raw){render([],"Escribí o dictá algo.");return;}
  const q=norm(raw);
  const hasVerb=VERBOS.some(v=>q.includes(v));
  const local=detectLocal(q);
  if(local){render([{row:local.row,dist:null}],`Mostrando: ${local.nombre}`);return;}
  const barrio=detectBarrio(q);
  const toks=q.split(/\s+/).filter(x=>x.length>2&&!VERBOS.includes(x));
  const out=[];
  for(const d of DATA){
    if(barrio&&d.barrioNorm&&!d.barrioNorm.includes(barrio))continue;
    const sc=scoreRow(d,toks,hasVerb);
    if(sc>0){const dist=(USER_POS&&isFinite(d.lat)&&isFinite(d.lng))?hav(USER_POS,{lat:d.lat,lng:d.lng}):null;out.push({row:d.row,dist,score:sc});}
  }
  out.sort((a,b)=>b.score-a.score);
  render(out);
}

// --- CERCA ---
function buscarCerca(){
  if(!LOADED){showStatus("Esperá que cargue el CSV…");return;}
  const hint=document.getElementById('gpsHint');
  function run(){
    const n=[];for(const d of DATA){if(!isFinite(d.lat)||!isFinite(d.lng))continue;const dist=hav(USER_POS,{lat:d.lat,lng:d.lng});n.push({row:d.row,dist});}
    n.sort((a,b)=>a.dist-b.dist);let r=1.5;let inR=n.filter(o=>o.dist<=r);if(inR.length<3){r=3;inR=n.filter(o=>o.dist<=r);}
    hint.style.display='block';hint.textContent=`📍 Mostrando ≤ ${r.toFixed(1)} km · ${inR.length} resultados`;render(inR);
  }
  if(USER_POS){run();return;}
  if(!navigator.geolocation){USER_POS={lat:-34.6037,lng:-58.3816};hint.textContent="📍 Sin GPS, usando centro.";hint.style.display='block';run();return;}
  navigator.geolocation.getCurrentPosition(p=>{USER_POS={lat:p.coords.latitude,lng:p.coords.longitude};hint.textContent="📍 Ubicación detectada.";hint.style.display='block';run();},()=>{USER_POS={lat:-34.6037,lng:-58.3816};hint.textContent="📍 Sin permiso, usando centro.";hint.style.display='block';run();});
}

// --- RENDER ---
function render(list,msg){
  const box=document.getElementById('results');
  if(!list.length){box.innerHTML=`<div class="tiny">${msg||"Sin resultados."}</div>`;return;}
  box.innerHTML=list.map(o=>{const r=o.row;const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((r.direccion||"")+" "+(r.barrio||""))}`;const dist=(typeof o.dist==="number")?`<div class="meta">≈ ${o.dist.toFixed(2)} km</div>`:"";return`<div class="card"><div class="title">${r.nombre_local||"(sin nombre)"} — <span>${r.rubro||""}</span></div><div>${r.direccion||""} ${r.barrio?`(${r.barrio})`:""}</div>${dist}<div class="meta"><a href="${maps}" target="_blank">Cómo llegar</a></div></div>`;}).join("");
}

// --- EVENTOS ---
document.getElementById('goBtn').onclick=()=>buscar();
document.getElementById('clearBtn').onclick=()=>{document.getElementById('qall').value='';document.getElementById('results').innerHTML='';};
document.getElementById('locBtn').onclick=buscarCerca;
document.getElementById('refreshBtn').onclick=loadCSV;
document.getElementById('autoChk').onchange=e=>{if(e.target.checked){loadCSV();refreshTimer=setInterval(loadCSV,15000);}else{clearInterval(refreshTimer);}};
document.getElementById('qall').addEventListener('keydown',e=>{if(e.key==="Enter"){e.preventDefault();buscar();}});

// --- VOZ ---
(function(){
  const b=document.getElementById('micBtn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){b.disabled=true;b.innerText='🎤—';return;}
  const rec=new SR();rec.lang='es-AR';rec.continuous=false;rec.interimResults=false;
  let active=false;
  b.onclick=()=>{if(active)return;try{rec.start();active=true;b.textContent='⏺️';showStatus("Escuchando…");}catch{}};
  rec.onresult=e=>{const t=e.results[0][0].transcript||'';const limpio=t.trim();document.getElementById('qall').value=limpio;showStatus("Voz: "+limpio);buscar(limpio);};
  rec.onerror=()=>{showStatus("Error al escuchar.");};
  rec.onend=()=>{active=false;b.textContent='🎤';};
})();

// --- INICIO ---
loadCSV();
</script>
</body>
</html>
