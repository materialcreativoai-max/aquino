<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquí Nomás — v4 estable (correcciones)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{flex:1 1 200px;padding:10px 12px;border-radius:999px;border:1px solid #e2e8f0}
.btn{border:none;border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.mic{background:#fee2e2;color:#b91c1c}
.btn.secondary{background:#e5edff;color:#1e40af}
.btn.ghost{background:#fff;color:#6b7280;border:1px solid #e2e8f0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#e5e7eb;border-radius:999px;padding:4px 8px;font-size:12px}
.tiny{font-size:12px;color:#6b7280;margin-top:4px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.card .title{font-weight:600}
.card .meta{font-size:12px;color:#6b7280;margin-top:4px}
.empty{font-size:14px;color:#6b7280;padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ Aquí Nomás — v4 estable</h1>

  <div class="box">
    <div class="row">
      <input id="q" class="input" placeholder="Ej: 'almorzar en Santa Fe', 'arreglo de cierres Caballito'">
      <button id="mic" class="btn mic">🎤 Voz</button>
      <button id="go" class="btn">Buscar</button>
      <button id="clear" class="btn ghost">Limpiar</button>
      <button id="near" class="btn secondary">📍 Cerca</button>
    </div>
    <div id="chips" class="chips"></div>
    <div id="status" class="tiny"></div>
  </div>

  <div id="results" class="box"></div>
</div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
let DATA=[],POS=null;
const R_KM=1.0;
const $=s=>document.querySelector(s);
function norm(t){return(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function parseCSV(t){const r=t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));const h=r.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));return r.map(l=>Object.fromEntries(h.map((x,i)=>[x,l[i]||""])));}
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),A=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(A));}
function load(){fetch(CSV+"&nocache="+Date.now()).then(r=>r.text()).then(t=>{DATA=parseCSV(t);$("#status").textContent="CSV cargado: "+DATA.length+" filas.";});}
function matchZone(r,z){if(!z)return!0;const f=norm((r.direccion||"")+" "+(r.barrio||""));const n=norm(z);if(n.includes(" y ")){const[a,b]=n.split(" y ").map(x=>x.trim());return f.includes(a)&&f.includes(b);}return f.includes(n);}
function score(r,q,z){if(!q&&!z)return 0;let s=0;const txt=norm([r.nombre_local,r.nombre,r.rubro,r.categoria,r.descripcion].join(" "));const tokens=norm(q).split(/\s+/).filter(x=>x.length>2);tokens.forEach(t=>{if(txt.includes(t))s++;});if(!matchZone(r,z))s=-1;return s;}
function understand(raw){const t=(raw||"").trim();const m=t.match(/(?:en|por|sobre)\s+([a-záéíóúñ\s]+)/i);return m?{q:t.replace(m[0],""),z:m[1].trim()}:{q:t,z:""};}
function render(list){if(!list.length){$("#results").innerHTML='<div class="empty">Sin resultados.</div>';return;}$("#results").innerHTML=list.map(r=>{const name=r.nombre_local||r.nombre||"(sin nombre)";const dist=r._distKm?"<div class='meta'>≈ "+r._distKm.toFixed(2)+" km</div>":"";const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((r.direccion||"")+" "+(r.barrio||""))}`;return`<div class="card"><div class="title">${name} — <span>${r.rubro||""}</span></div><div>${r.direccion||""} ${r.barrio?`(${r.barrio})`:""}</div>${dist}<div class='meta'><a href='${maps}' target='_blank'>Cómo llegar</a></div></div>`;}).join("");}
function buscar(q,z,near){const L=[];for(const r of DATA){let s=score(r,q,z);if(s>=0&&POS){const la=parseFloat(r.lat)||parseFloat(r.latitud),ln=parseFloat(r.lng)||parseFloat(r.longitud);if(!isNaN(la)&&!isNaN(ln)){const d=hav({lat:POS.lat,lng:POS.lng},{lat:la,lng:ln});r._distKm=d;if(near&&d>R_KM){s=-1;}}}if(s>=0)L.push(r);}return L;}
$("#go").onclick=()=>{const {q,z}=understand($("#q").value);const list=buscar(q,z,false);render(list);$("#status").textContent="Resultados: "+list.length;};
$("#clear").onclick=()=>{$("#q").value="";$("#results").innerHTML="";$("#status").textContent="";};
$("#near").onclick=()=>{if(!navigator.geolocation){$("#status").textContent="Sin geolocalización";return;}navigator.geolocation.getCurrentPosition(p=>{POS={lat:p.coords.latitude,lng:p.coords.longitude};const list=buscar("", "", true);render(list);$("#status").textContent="Cerca (≤1 km): "+list.length;});};
$("#mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("#status").textContent="Sin reconocimiento de voz.";return;}const rec=new SR();rec.lang="es-AR";rec.start();$("#status").textContent="Escuchando…";rec.onresult=e=>{const t=e.results[0][0].transcript;$("#q").value=t;rec.stop();const {q,z}=understand(t);const list=buscar(q,z,false);render(list);$("#status").textContent="Voz: "+t+" ("+list.length+")";};rec.onerror=()=>$("#status").textContent="Error al escuchar.";};
load();
</script>
</body>
</html>
