@@ -48,13 +48,226 @@ <h1>🏷️ Aquí Nomás — probando (estable)</h1>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
const R_KM=1.0;
let DATA=[],POS=null;
const $=s=>document.querySelector(s);
const setStatus=t=>$("#status").textContent=t||"";

function norm(t){return(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function parseCSV(t){const r=t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));const h=r.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));return r.map(l=>Object.fromEntries(h.map((x,i)=>[x,l[i]||""])));}
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),A=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(A));}
async function load(){if(DATA.length)return;const res=await fetch(CSV_URL+"&nocache="+Date.now());const t=await res.text();DATA=parseCSV(t);setStatus("CSV cargado: "+DATA.length+" filas.");}
let DATA=[];   // comercios
let POS=null;  // {lat,lng}

// --- buscar coincidencias de frase
const $ = s => document.querySelector(s);
const qInput   = $("#q");
const statusEl = $("#status");
const resultsEl= $("#results");

function setStatus(msg){
  statusEl.textContent = msg || "";
}

function norm(t){
  return (t||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function parseCSV(txt){
  const rows = txt.trim()
    .split(/\r?\n/)
    .map(r => r.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
      .map(c => c.replace(/^"|"$/g,"")));
  const head = rows.shift()
    .map(h => h.trim().toLowerCase().replace(/\s+/g,"_"));
  return rows.map(r => {
    const o={};
    head.forEach((h,i)=>{o[h]=(r[i]||"").trim();});
    return o;
  });
}

function parseCoord(v){
  if(!v) return NaN;
  let s=String(v).replace(",",".");
  let n=parseFloat(s);
  if(!isFinite(n)) return NaN;
  if(Math.abs(n)>180) n=n/1e6;
  return n;
}

function haversineKm(a,b){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat);
  const dLng=toRad(b.lng-a.lng);
  const s1=Math.sin(dLat/2),s2=Math.sin(dLng/2);
  const A=s1*s1+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*s2*s2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(A)));
}

async function loadData(){
  if(DATA.length) return;
  setStatus("Cargando comercios…");
  const res = await fetch(CSV_URL+"&nocache="+Date.now());
  const txt = await res.text();
  const raw = parseCSV(txt);

  DATA = raw.map(r=>{
    const name   = r.nombre_local || r.nombre || r.comercio || r.local || "";
    const rubro  = r.rubro || r.categoria || r.categoría || "";
    const barrio = r.barrio || r.zona || "";
    const dir    = r.direccion || r.dirección || r.calle || "";

    const latStr = r.lat || r.latitud || r.latitude || "";
    const lngStr = r.lng || r.longitud || r.lon || r.longitude || "";

    const lat = parseCoord(latStr);
    const lng = parseCoord(lngStr);

    const baseText = norm([name,rubro,barrio,dir].join(" "));

    return { raw:r, name, rubro, barrio, dir, lat, lng, baseText };
  });

  setStatus("Datos cargados: "+DATA.length+" locales.");
}

// tokens: saco artículos y conectores para que las frases no molesten
function tokensFromQuery(q){
  const stop = ["en","por","sobre","de","la","el","los","las","un","una","y","al","del","para","cerca"];
  return norm(q)
    .split(/\s+/)
    .filter(t => t && !stop.includes(t) && t.length>=3);
}

function search(query, onlyNear){
  const tokens = tokensFromQuery(query);

  if(!tokens.length && !onlyNear){
    setStatus("Escribí algo más específico.");
    return [];
  }

  const out = [];

  for(const row of DATA){
    let match = true;

    // coincidencia por intención: basta que ALGUNA palabra clave aparezca
    if(tokens.length){
      const hits = tokens.filter(t => row.baseText.includes(t));
      if(!hits.length) match = false;
    }

    if(!match) continue;

    // distancia (solo si tenemos POS y coords)
    let dist = null;
    if(POS && !isNaN(row.lat) && !isNaN(row.lng)){
      dist = haversineKm(POS,{lat:row.lat,lng:row.lng});
    }

    // modo CERCA: solo dentro del km
    if(onlyNear){
      if(dist==null || dist>R_KM) continue;
    }

    out.push({...row, distKm:dist});
  }

  // orden: primero más cerca, luego nombre
  out.sort((a,b)=>{
    const da = (typeof a.distKm==="number")?a.distKm:9999;
    const db = (typeof b.distKm==="number")?b.distKm:9999;
    if(da!==db) return da-db;
    return a.name.localeCompare(b.name);
  });

  return out;
}

function render(list){
  if(!list.length){
    resultsEl.innerHTML = '<div class="empty">Sin resultados.</div>';
    return;
  }
  resultsEl.innerHTML = list.map(r=>{
    const maps = `https://www.google.com/maps/search/?api=1&query=${
      encodeURIComponent((r.dir||"")+" "+(r.barrio||""))
    }`;
    const dist = (typeof r.distKm==="number")
      ? `<div class="meta">≈ ${r.distKm.toFixed(2)} km</div>` : "";
    return `
      <div class="card">
        <div class="title">${r.name || "(sin nombre)"} — <span>${r.rubro||""}</span></div>
        <div>${r.dir||""} ${r.barrio?`(${r.barrio})`:""}</div>
        ${dist}
        <div class="meta"><a href="${maps}" target="_blank">Cómo llegar</a></div>
      </div>
    `;
  }).join("");
}

async function runSearch(){
  await loadData();
  const q = qInput.value.trim();
  const list = search(q,false);
  render(list);
  setStatus("Resultados: "+list.length);
}

async function runNear(){
  await loadData();
  if(!navigator.geolocation){
    setStatus("Tu navegador no permite geolocalización.");
    return;
  }
  setStatus("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(pos=>{
    POS = {lat:pos.coords.latitude,lng:pos.coords.longitude};
    const list = search("",true);
    render(list);
    setStatus("Locales cercanos (≤ 1 km): "+list.length);
  },()=>{
    setStatus("No se pudo obtener la ubicación.");
  });
}

async function runVoice(){
  await loadData();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setStatus("Tu navegador no admite reconocimiento de voz.");
    return;
  }
  const rec = new SR();
  rec.lang = "es-AR";
  rec.start();
  setStatus("Escuchando…");
  rec.onresult = e=>{
    const txt = e.results[0][0].transcript;
    qInput.value = txt;
    rec.stop();
    runSearch();
    setStatus("Voz: "+txt);
  };
  rec.onerror = ()=>{
    setStatus("Error al escuchar.");
  };
}

// Eventos
$("#go").addEventListener("click", runSearch);
$("#near").addEventListener("click", runNear);
$("#mic").addEventListener("click", runVoice);
$("#clear").addEventListener("click", ()=>{
  qInput.value="";
  resultsEl.innerHTML="";
  setStatus("Buscador limpio. Probá una frase o 'Cerca'.");
});
qInput.addEventListener("keydown", e=>{
  if(e.key==="Enter") runSearch();
});

// precarga silenciosa
loadData().then(()=>{
  setStatus("Listo. Escribí, usá Voz o Cerca.");
});
</script>
