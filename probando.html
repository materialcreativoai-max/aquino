<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquí Nomás — probando (texto + voz corregido)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{flex:1 1 200px;padding:10px 12px;border-radius:999px;border:1px solid #e2e8f0}
.btn{border-radius:999px;border:1px solid transparent;padding:8px 12px;font-size:14px;cursor:pointer;background:#0b5cff;color:#fff}
.btn.ghost{background:#fff;color:#6b7280;border-color:#e2e8f0}
.btn.secondary{background:#e5edff;color:#1e40af}
.btn.mic{background:#fee2e2;color:#b91c1c}
.tiny{font-size:12px;color:#6b7280;margin-top:4px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.card .title{font-weight:600;margin-bottom:2px}
.card .title span{font-weight:400;color:#6b7280}
.card .meta{font-size:12px;color:#6b7280;margin-top:4px}
.empty{font-size:14px;color:#6b7280;padding:8px}
@media(max-width:600px){
  .row{flex-direction:column;align-items:stretch}
  .input{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ Aquí Nomás — probando (estable)</h1>

  <div class="box">
    <div class="row">
      <input id="q" class="input" placeholder="Ej: 'almorzar en Santa Fe', 'arreglo de cierres Caballito'">
      <button id="mic"   class="btn mic">🎤 Voz</button>
      <button id="go"    class="btn">Buscar</button>
      <button id="clear" class="btn ghost">Limpiar</button>
      <button id="near"  class="btn secondary">📍 Cerca (1 km)</button>
    </div>
    <div id="status" class="tiny"></div>
  </div>

  <div id="results" class="box"></div>
</div>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
const R_KM=1.0;
let DATA=[],POS=null;
const $=s=>document.querySelector(s);
const setStatus=t=>$("#status").textContent=t||"";

function norm(t){return(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function parseCSV(t){const r=t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));const h=r.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));return r.map(l=>Object.fromEntries(h.map((x,i)=>[x,l[i]||""])));}
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),A=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(A));}

async function load(){if(DATA.length)return;const res=await fetch(CSV_URL+"&nocache="+Date.now());const t=await res.text();DATA=parseCSV(t);setStatus("CSV cargado: "+DATA.length+" filas.");}

// --- buscador flexible ---
function matchRow(r,q){
  const base=norm([r.nombre_local,r.nombre,r.rubro,r.categoria,r.barrio,r.direccion,r.descripcion].join(" "));
  const words=norm(q).split(/\s+/).filter(x=>x.length>2);
  if(!words.length)return true;
  return words.some(w=>base.includes(w));
}

function buscar(q,near){
  const L=[];
  for(const r of DATA){
    let la=parseFloat(r.lat)||parseFloat(r.latitud),ln=parseFloat(r.lng)||parseFloat(r.longitud);
    if(isNaN(la)||isNaN(ln))la=ln=null;
    let dist=POS?(la&&ln?hav(POS,{lat:la,lng:ln}):null):null;
    if(near){if(!dist||dist>R_KM)continue;}
    if(q&&!matchRow(r,q))continue;
    r._distKm=dist;
    L.push(r);
  }
  L.sort((a,b)=>{const da=a._distKm||9999,db=b._distKm||9999;return da-db;});
  return L;
}

function render(L){
  if(!L.length){$("#results").innerHTML='<div class="empty">Sin resultados.</div>';return;}
  $("#results").innerHTML=L.map(r=>{
    const name=r.nombre_local||r.nombre||"(sin nombre)";
    const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((r.direccion||"")+" "+(r.barrio||""))}`;
    const dist=(typeof r._distKm==="number")?`<div class='meta'>≈ ${r._distKm.toFixed(2)} km</div>`:"";
    return `<div class="card"><div class="title">${name} — <span>${r.rubro||""}</span></div>
    <div>${r.direccion||""} ${r.barrio?`(${r.barrio})`:""}</div>${dist}
    <div class="meta"><a href="${maps}" target="_blank">Cómo llegar</a></div></div>`;
  }).join("");
}

$("#go").onclick=async()=>{await load();const q=$("#q").value.trim();const L=buscar(q,false);render(L);setStatus("Resultados: "+L.length);};
$("#clear").onclick=()=>{$("#q").value="";$("#results").innerHTML="";setStatus("");};
$("#near").onclick=async()=>{await load();if(!navigator.geolocation){setStatus("Sin geolocalización.");return;}
navigator.geolocation.getCurrentPosition(p=>{POS={lat:p.coords.latitude,lng:p.coords.longitude};const L=buscar("",true);render(L);setStatus("Cerca (≤1 km): "+L.length);});};

// --- voz + enter ---
$("#mic").onclick=async()=>{await load();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus("Sin reconocimiento de voz.");return;}
const rec=new SR();rec.lang="es-AR";rec.start();setStatus("🎤 Escuchando…");
rec.onresult=e=>{const t=e.results[0][0].transcript;$("#q").value=t;rec.stop();const L=buscar(t,false);render(L);setStatus("Voz: '"+t+"' ("+L.length+")");};
rec.onerror=()=>setStatus("Error al escuchar.");};
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click();});

load();
</script>
</body>
</html>
