<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquí Nomás — probando (estable final)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{flex:1 1 200px;padding:10px 12px;border-radius:999px;border:1px solid #e2e8f0}
.btn{border-radius:999px;border:1px solid transparent;padding:8px 12px;font-size:14px;cursor:pointer;background:#0b5cff;color:#fff}
.btn.ghost{background:#fff;color:#6b7280;border-color:#e2e8f0}
.btn.secondary{background:#e5edff;color:#1e40af}
.btn.mic{background:#fee2e2;color:#b91c1c}
.tiny{font-size:12px;color:#6b7280;margin-top:4px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.card .title{font-weight:600;margin-bottom:2px}
.card .title span{font-weight:400;color:#6b7280}
.card .meta{font-size:12px;color:#6b7280;margin-top:4px}
.empty{font-size:14px;color:#6b7280;padding:8px}
@media(max-width:600px){
  .row{flex-direction:column;align-items:stretch}
  .input{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏷️ Aquí Nomás — probando (estable)</h1>

  <div class="box">
    <div class="row">
      <input id="q" class="input" placeholder="Ej: 'almorzar en Santa Fe', 'arreglo de cierres Caballito'">
      <button id="mic"   class="btn mic">🎤 Voz</button>
      <button id="go"    class="btn">Buscar</button>
      <button id="clear" class="btn ghost">Limpiar</button>
      <button id="near"  class="btn secondary">📍 Cerca (1 km)</button>
    </div>
    <div id="status" class="tiny"></div>
  </div>

  <div id="results" class="box"></div>
</div>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
const R_KM=1.0;
let DATA=[],POS=null;

const $=s=>document.querySelector(s);
const qInput=$("#q"),statusEl=$("#status"),resultsEl=$("#results");
const setStatus=t=>statusEl.textContent=t||"";

function norm(t){return(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function parseCSV(t){
  const r=t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));
  const h=r.shift().map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));
  return r.map(l=>Object.fromEntries(h.map((x,i)=>[x,l[i]||""])));
}
function parseCoord(v){if(!v)return NaN;let s=String(v).replace(",",".");let n=parseFloat(s);if(!isFinite(n))return NaN;if(Math.abs(n)>180)n/=1e6;return n;}
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);const A=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(A));}

async function loadData(){
  if(DATA.length)return;
  setStatus("Cargando comercios…");
  const res=await fetch(CSV_URL+"&nocache="+Date.now());
  const txt=await res.text();
  const raw=parseCSV(txt);

  // arreglo de nombres: usa tus columnas reales, sin perder rubros ni dirección
  DATA = raw.map(r=>{
    const name   = r.nombre_local || r.nombre || r.comercio || r.local || r.Nombre || "";
    const rubro  = r.rubro || r.categoria || r.categoría || r.Rubro || "";
    const barrio = r.barrio || r.zona || r.Barrio || "";
    const dir    = r.direccion || r.dirección || r.calle || r.Direccion || "";
    const latStr = r.lat || r.latitud || r.latitude || r.Latitud || "";
    const lngStr = r.lng || r.longitud || r.lon || r.longitude || r.Longitud || "";
    const lat=parseCoord(latStr),lng=parseCoord(lngStr);
    const baseText=norm([name,rubro,barrio,dir].join(" "));
    return {raw:r,name,rubro,barrio,dir,lat,lng,baseText};
  });
  setStatus("Datos cargados: "+DATA.length+" locales.");
}

function tokensFromQuery(q){
  const stop=["en","por","sobre","de","la","el","los","las","un","una","y","al","del","para","cerca"];
  return norm(q).split(/\s+/).filter(t=>t&&!stop.includes(t)&&t.length>=3);
}

function search(query,onlyNear){
  const tokens=tokensFromQuery(query);
  if(!tokens.length&&!onlyNear){setStatus("Escribí algo más específico.");return[];}
  const out=[];
  for(const row of DATA){
    let match=true;
    if(tokens.length){
      const hits=tokens.filter(t=>row.baseText.includes(t));
      if(!hits.length)match=false;
    }
    if(!match)continue;
    let dist=null;
    if(POS&&!isNaN(row.lat)&&!isNaN(row.lng)){
      dist=hav(POS,{lat:row.lat,lng:row.lng});
    }
    if(onlyNear){
      if(dist==null||dist>R_KM)continue;
    }
    out.push({...row,distKm:dist});
  }
  out.sort((a,b)=>{
    const da=(typeof a.distKm==="number")?a.distKm:9999;
    const db=(typeof b.distKm==="number")?b.distKm:9999;
    if(da!==db)return da-db;
    return a.name.localeCompare(b.name);
  });
  return out;
}

function render(list){
  if(!list.length){resultsEl.innerHTML='<div class="empty">Sin resultados.</div>';return;}
  resultsEl.innerHTML=list.map(r=>{
    const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((r.dir||"")+" "+(r.barrio||""))}`;
    const dist=(typeof r.distKm==="number")?`<div class="meta">≈ ${r.distKm.toFixed(2)} km</div>`:"";
    r
