<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquí Nomás — App</title>
<body style="font-family:sans-serif;background:#f8f9fa;color:#111;margin:0">
<h2 style="padding:10px">Aquí Nomás — Demo</h2>
<input id="q" placeholder="Decí o escribí algo…" style="padding:10px;width:80%;max-width:500px">
<button id="mic">🎤</button>
<button id="near">📍 Cerca</button>
<div id="out" style="margin:1em"></div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
let DATA=[],POS=null;

fetch(CSV).then(r=>r.text()).then(t=>{
  const [h,...rows]=t.trim().split(/\r?\n/);
  const head=h.split(",").map(x=>x.toLowerCase());
  DATA=rows.map(l=>Object.fromEntries(l.split(",").map((v,i)=>[head[i],v])));
});

function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function distKm(a,b){const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat),dLon=toRad(b.lng-a.lng);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2));}

function render(arr){out.innerHTML=arr.map(r=>`<div><b>${r.nombre_local}</b> — ${r.rubro}<br>${r.direccion}</div>`).join("<hr>")||"Sin resultados";}

function search(q){
  const w=norm(q);
  if(!w)return;
  let res=DATA.filter(r=>norm(r.nombre_local).includes(w)||norm(r.rubro).includes(w)||norm(r.direccion).includes(w));
  if(POS)res=res.map(r=>{r._d=distKm(POS,{lat:+r.lat,lng:+r.lng});return r;}).filter(r=>r._d<1.5).sort((a,b)=>a._d-b._d);
  render(res.slice(0,30));
}

mic.onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert("Sin soporte de voz");
  const r=new SR();r.lang="es-AR";
  r.onresult=e=>{q.value=e.results[0][0].transcript;search(q.value);}
  r.start();
};
near.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{
  POS={lat:p.coords.latitude,lng:p.coords.longitude};
  search(q.value||"");
});
q.onkeydown=e=>{if(e.key==="Enter")search(q.value);}
</script>
</body>
</html>
