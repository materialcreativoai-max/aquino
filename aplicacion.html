<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerías y Servicios</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#0f1115;color:#e8ecf1;margin:0;text-align:center}
header{padding:14px;border-bottom:1px solid #1f2430}
h1{margin:0;font-size:20px}
main{max-width:900px;margin:auto;padding:20px}
input{padding:10px 12px;border-radius:8px;border:1px solid #273042;background:#0d0f14;color:#e8ecf1;width:70%}
button{padding:10px 14px;border-radius:10px;border:1px solid #273042;background:#10151e;color:#e8ecf1;cursor:pointer;margin:6px}
button:hover{border-color:#3a475e}
#resultado{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.card{background:#171a21;border:1px solid #232838;border-radius:14px;padding:10px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}
.empty{border:1px dashed #273042;border-radius:14px;padding:20px;margin-top:20px;color:#aab3c3}
footer{font-size:12px;color:#93a0b4;padding:10px;border-top:1px solid #1f2430}
</style>
</head>
<body>
<header><h1>Galerías y Servicios</h1></header>

<main>
  <p id="estado">Listo. No se cargan comercios hasta que lo pidas.</p>
  <input id="busqueda" type="text" placeholder="Escribí o hablá para buscar…">
  <div>
    <button id="btnBuscar">Buscar</button>
    <button id="btnVoz">🎤 Voz</button>
    <button id="btnCerca">Cerca</button>
    <button id="btnActualizar">Actualizar</button>
    <button id="btnLimpiar">Limpiar</button>
  </div>
  <section id="resultado"></section>
  <div id="vacio" class="empty" style="display:none;">Sin resultados.</div>
</main>

<footer>vEstable • texto o voz • “Cerca” • sin autolistar</footer>

<script>
const DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
let DATA = [];
let LOADED = false;

const $ = s => document.querySelector(s);
const estado = t => { $('#estado').textContent = t; console.log(t); };

async function cargarCSV(){
  estado("Cargando CSV…");
  try {
    const res = await fetch(DATA_URL + "&nocache=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = text
      .split(/\r?\n/)
      .filter(l => l.trim() !== "")
      .map(l => l.split(","));

    const head = rows.shift().map(h => h.trim().toLowerCase());

    const findIdx = keys =>
      head.findIndex(h => keys.some(k => h.includes(k)));

    const idxNombre    = findIdx(["nombre","comercio","local"]);
    const idxCategoria = findIdx(["categoria","rubro","tipo"]);
    const idxBarrio    = findIdx(["barrio","zona"]);
    const idxDireccion = findIdx(["direccion","dirección","calle"]);
    const idxLat       = findIdx(["lat","latitud","latitude"]);
    const idxLng       = findIdx(["lng","lon","longitud","longitude"]);
    const idxImagen    = findIdx(["imagen","foto","img","url"]);

    DATA = rows.map(r => ({
      nombre:    idxNombre    >= 0 ? (r[idxNombre]    || "") : "",
      categoria: idxCategoria >= 0 ? (r[idxCategoria] || "") : "",
      barrio:    idxBarrio    >= 0 ? (r[idxBarrio]    || "") : "",
      direccion: idxDireccion >= 0 ? (r[idxDireccion] || "") : "",
      lat:       idxLat       >= 0 ? (parseFloat(r[idxLat]) || null) : null,
      lng:       idxLng       >= 0 ? (parseFloat(r[idxLng]) || null) : null,
      imagen:    idxImagen    >= 0 ? (r[idxImagen]    || "") : ""
    }));

    LOADED = true;
    estado("CSV cargado: " + DATA.length + " filas (no se muestran hasta que busques).");
  } catch(e) {
    console.error(e);
    estado("Error al cargar datos del Sheet.");
  }
}

function render(lista){
  const cont = $("#resultado");
  if(!lista || !lista.length){
    cont.innerHTML = "";
    $("#vacio").style.display = "block";
    return;
  }
  cont.innerHTML = lista.map(d => `
  <div class="card">
    ${d.imagen
      ? `<img src="${d.imagen}" alt="${d.nombre}" onerror="this.remove()">`
      : `<div style="height:150px;display:flex;align-items:center;justify-content:center;color:#7d8aa3;">Sin imagen</div>`}
    <h3>${d.nombre}</h3>
    <p>${d.categoria || ""}${d.barrio ? " · " + d.barrio : ""}</p>
    <p>${d.direccion || ""}</p>
  </div>`).join("");
  $("#vacio").style.display = "none";
}

function normalizarTxt(t){
  return t.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function filtrar(q){
  const textoQ = normalizarTxt(q);
  const tokens = textoQ.split(/\s+/).filter(t => t.length >= 3);
  if(!tokens.length) return [];

  return DATA.filter(d => {
    const base = normalizarTxt(
      [d.nombre, d.categoria, d.barrio, d.direccion].join(" ")
    );
    // matchea si al menos un token aparece
    return tokens.some(t => base.includes(t));
  });
}

$("#btnBuscar").onclick = async ()=>{
  if(!LOADED) await cargarCSV();
  const q = $("#busqueda").value.trim();
  if(!q){
    estado("Escribí algo o usá el micrófono.");
    return;
  }
  const r = filtrar(q);
  render(r);
  estado("Buscar: " + r.length + " resultado(s).");
};

$("#btnLimpiar").onclick = ()=>{
  $("#busqueda").value = "";
  render([]);
  estado("Limpio. Nada en pantalla hasta que busques.");
};

$("#btnActualizar").onclick = async ()=>{
  LOADED = false;
  await cargarCSV();
  render([]);
  estado("Datos actualizados. Buscá de nuevo para ver resultados.");
};

$("#btnCerca").onclick = async ()=>{
  if(!LOADED) await cargarCSV();
  if(!navigator.geolocation){
    estado("Geolocalización no disponible.");
    return;
  }
  estado("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    const R = 6371000;
    const toRad = g => g * Math.PI / 180;
    const radio = 600;

    const lista = DATA
      .filter(d => d.lat != null && d.lng != null)
      .map(d=>{
        const dLat = toRad(d.lat - latitude);
        const dLon = toRad(d.lng - longitude);
        const a = Math.sin(dLat/2)**2 +
          Math.cos(toRad(latitude))*Math.cos(toRad(d.lat))*Math.sin(dLon/2)**2;
        const dist = 2 * R * Math.asin(Math.sqrt(a));
        return {...d, dist};
      })
      .filter(d => d.dist <= radio)
      .sort((a,b) => a.dist - b.dist);

    render(lista);
    if(lista.length){
      estado("Cerca: " + lista.length + " en 600 m.");
    }else{
      estado("Cerca: no encontramos locales en 600 m.");
    }
  },()=>{
    estado("No se pudo obtener la ubicación.");
  });
};

$("#btnVoz").onclick = async ()=>{
  if(!LOADED) await cargarCSV();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    estado("Tu navegador no admite reconocimiento de voz.");
    return;
  }
  const rec = new SR();
  rec.lang = "es-ES";
  rec.start();
  estado("Escuchando…");
  rec.onresult = e=>{
    const txt = e.results[0][0].transcript;
    $("#busqueda").value = txt;
    const r = filtrar(txt);
    render(r);
    estado("Voz: '" + txt + "' → " + r.length + " resultado(s).");
  };
  rec.onerror = ()=>{
    estado("Error al escuchar.");
  };
};

cargarCSV();
</script>
</body>
</html>
