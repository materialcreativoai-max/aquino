<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Galerías y Servicios — Aquí Nomás</title>
<style>
:root{--azul:#0b5cff;}
body{margin:0;background:#121418;color:#e6e9ee;
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
header{background:#121418;padding:16px 0;border-bottom:1px solid #1f232b;}
a.logo{color:var(--azul);text-decoration:none;font-weight:600;font-size:18px;}
.wrap{padding:30px}
input{padding:10px 12px;width:60%;max-width:400px;border:1px solid #1f232b;
border-radius:8px;background:#1b1f26;color:#e6e9ee}
button{padding:10px 14px;margin:4px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn{background:var(--azul);color:#fff}
.btn.alt{background:#1b1f26;color:#fff}
.btn.ghost{background:#1b1f26;color:#e6e9ee;border:1px solid #1f232b}
.card{border:1px solid #1f232b;background:#20242b;border-radius:10px;
padding:12px;margin:10px auto;max-width:700px;text-align:left}
.card b{color:var(--azul)}
.card img{max-width:100%;max-height:100px;border-radius:8px;display:block;margin-top:8px;object-fit:cover}
footer{margin-top:30px;font-size:13px;color:#8b94a1}
</style>
</head>
<body>
<header><a href="index.html" class="logo">Galerías y Servicios</a></header>
<div class="wrap">
<h2>Abriendo app…</h2>
<input id="qall" placeholder="Buscar o decir un comercio…">
<div>
  <button id="micBtn" class="btn">🎤 Voz</button>
  <button id="nearBtn" class="btn alt">📍 Cerca</button>
  <button id="clearBtn" class="btn ghost">Limpiar</button>
  <button id="refreshBtn" class="btn alt">Actualizar</button>
</div>
<div id="results"></div>
</div>
<footer>Datos actualizados en tiempo real desde Google Sheets</footer>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
let DATA=[],POS=null;

function norm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();}
function distKm(a,b){const R=6371,t=x=>x*Math.PI/180,dLat=t(b.lat-a.lat),dLon=t(b.lng-a.lng);
 return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2));}

function parseCSV(txt){
  const r=txt.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"")));
  const h=r.shift().map(x=>x.toLowerCase());return r.map(v=>Object.fromEntries(h.map((k,i)=>[k,v[i]])));
}

function render(arr){
  const box=document.getElementById("results");
  box.innerHTML=(arr||[]).map(r=>`
    <div class="card">
      <b>${r.nombre_local||"—"}</b> — ${r.rubro||""}<br>
      ${r.direccion||""} ${r.barrio?`(${r.barrio})`:""}
      ${r.imagen_url?`<img src="${r.imagen_url}" alt="${r.nombre_local}">`:""}
    </div>
  `).join("")||"<p>Sin resultados</p>";
}

function buscar(qv){
  if(!DATA.length)return;
  const w=norm(qv);
  if(!w){render(DATA.slice(0,20));return;}
  let res=DATA.filter(r=>norm(r.nombre_local).includes(w)||norm(r.rubro).includes(w)||norm(r.direccion).includes(w)||norm(r.keywords||"").includes(w));
  if(POS){
    res=res.map(r=>{
      const lat=+r.lat,lng=+r.lng;
      r._d=(isFinite(lat)&&isFinite(lng))?distKm(POS,{lat,lng}):Infinity;
      return r;
    }).filter(r=>isFinite(r._d)&&r._d<=1.5).sort((a,b)=>a._d-b._d);
  }
  render(res.slice(0,40));
}

async function loadCSV(){
  const t=await fetch(CSV+"?v="+Date.now()).then(r=>r.text());
  DATA=parseCSV(t);render(DATA.slice(0,20));
}
loadCSV();

document.getElementById("qall").addEventListener("keydown",e=>{if(e.key==="Enter")buscar(e.target.value);});
document.getElementById("refreshBtn").onclick=()=>loadCSV();
document.getElementById("clearBtn").onclick=()=>{document.getElementById("qall").value="";POS=null;render(DATA.slice(0,20));};
document.getElementById("nearBtn").onclick=()=>{
  const go=p=>{POS={lat:p.coords.latitude,lng:p.coords.longitude};buscar(document.getElementById("qall").value||"");};
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(go,()=>{POS=null;buscar("");},{enableHighAccuracy:true,timeout:8000});
};
document.getElementById("micBtn").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert("Sin soporte de voz");
  const rec=new SR();rec.lang="es-AR";
  rec.onresult=e=>{const txt=e.results[0][0].transcript;document.getElementById("qall").value=txt;buscar(txt);};
  rec.start();
};
</script>
</body>
</html>
