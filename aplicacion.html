<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prueba mínima — Aquí Nomás</title>
<style>
body{background:#121418;color:#e6e9ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:30px}
button{padding:10px 14px;margin-top:12px;border:none;border-radius:8px;background:#0b5cff;color:#fff;cursor:pointer}
#out{margin-top:20px;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Prueba mínima — CSV</h1>
<p>Si ves texto debajo, el script se ejecuta.</p>
<button id="go">Cargar datos</button>
<div id="out">Esperando...</div>

<script>
document.getElementById("go").onclick=async()=>{
  const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
  document.getElementById("out").textContent="Leyendo CSV...";
  try{
    const t=await fetch(CSV).then(r=>r.text());
    const lines=t.split(/\r?\n/).slice(0,5).join("\n");
    document.getElementById("out").textContent="Primeras líneas del CSV:\n\n"+lines;
  }catch(e){
    document.getElementById("out").textContent="Error: "+e;
  }
};
</script>
</body>
</html>
