<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerías y Servicios</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#0f1115;color:#e8ecf1;margin:0;text-align:center}
header{padding:14px;border-bottom:1px solid #1f2430}
h1{margin:0;font-size:20px}
main{max-width:900px;margin:auto;padding:20px}
input{padding:10px 12px;border-radius:8px;border:1px solid #273042;background:#0d0f14;color:#e8ecf1;width:70%}
button{padding:10px 14px;border-radius:10px;border:1px solid #273042;background:#10151e;color:#e8ecf1;cursor:pointer;margin:6px}
button:hover{border-color:#3a475e}
#resultado{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.card{background:#171a21;border:1px solid #232838;border-radius:14px;padding:10px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}
.empty{border:1px dashed #273042;border-radius:14px;padding:20px;margin-top:20px;color:#aab3c3}
footer{font-size:12px;color:#93a0b4;padding:10px;border-top:1px solid #1f2430}
</style>
</head>
<body>
<header><h1>Galerías y Servicios</h1></header>

<main>
  <p id="estado">Listo. No se cargan comercios hasta que lo pidas.</p>
  <input id="busqueda" type="text" placeholder="Escribí o hablá para buscar…">
  <div>
    <button id="btnBuscar">Buscar</button>
    <button id="btnVoz">🎤 Voz</button>
    <button id="btnCerca">Cerca</button>
    <button id="btnActualizar">Actualizar</button>
    <button id="btnLimpiar">Limpiar</button>
  </div>
  <section id="resultado"></section>
  <div id="vacio" class="empty" style="display:none;">Sin resultados.</div>
</main>

<footer>vEstable • búsqueda por texto o voz • “Cerca” • sin autolistar</footer>

<script>
const DATA_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSg0UeYMVZj0b9H2V63XS37oXlIwJ6SL4n-m6WJEbspzM5OP9QA3QF6qSw4fr81dw/pub?gid=1861393565&single=true&output=csv";
let DATA=[], LOADED=false;

const $=s=>document.querySelector(s);
const estado=t=>{$('#estado').textContent=t;console.log(t);};

async function cargarCSV(){
  estado("Cargando CSV…");
  try{
    const res=await fetch(DATA_URL+"&nocache="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    const rows=text.split(/\r?\n/).filter(l=>l.trim()!=="").map(l=>splitCSV(l));
    const head=rows.shift().map(h=>h.trim().toLowerCase());
    const idx=k=>head.findIndex(h=>h.includes(k));
    DATA=rows.map(r=>({
      nombre:r[idx("nombre")]||"",
      categoria:r[idx("categoria")]||"",
      barrio:r[idx("barrio")]||"",
      direccion:r[idx("direccion")]||"",
      lat:parseNum(r[idx("lat")]),
      lng:parseNum(r[idx("lng")]),
      imagen:(r[idx("imagen")]||"").trim()
    }));
    LOADED=true;
    estado("CSV cargado: "+DATA.length+" filas (no se muestran hasta que busques).");
  }catch(e){console.error(e);estado("Error al cargar datos del Sheet.");}
}

function splitCSV(line){
  const out=[], re=/(?:^|,)(?:"([^"]*(?:""[^"]*)*)"|([^",]*))/g; let m;
  while((m=re.exec(line))!==null){ out.push((m[1]||m[2]||"").replace(/""/g,'"')); }
  return out;
}
function parseNum(v){ if(v==null) return null; const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null; }

function render(lista){
  $("#resultado").innerHTML=lista.map(d=>`
    <div class="card">
      ${/^https?:\/\//i.test(d.imagen)?`<img src="${d.imagen}" alt="${d.nombre}" onerror="this.remove()">`:`<div style='height:150px;display:flex;align-items:center;justify-content:center;color:#7d8aa3;'>Sin imagen</div>`}
      <h3>${d.nombre}</h3>
      <p>${d.categoria||""} ${d.barrio?"· "+d.barrio:""}</p>
      <p>${d.direccion||""}</p>
    </div>`).join("");
  $("#vacio").style.display=lista.length?"none":"block";
}

/* BÚSQUEDA SEMÁNTICA */
const limpiar = s => (s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")      // sin acentos
  .replace(/[^\p{L}\p{N}\s]/gu," ")                    // quita puntuación (.,!?)
  .replace(/\s+/g," ").trim();

const LEX = {
  "helados":["heladeria","helado"],
  "almorzar":["restaurante","menu","almuerzo"],
  "comer":["restaurante","comida","menu"],
  "cafe":["cafeteria","cafe"],
  "cerveza":["bar","cerveceria"],
  "postre":["heladeria","cafeteria","pasteleria"]
};

function expand(tokens){
  const extra=[];
  for(const t of tokens){ if(LEX[t]) extra.push(...LEX[t]); }
  return Array.from(new Set(tokens.concat(extra)));
}

function filtrar(q){
  const tokens = expand(limpiar(q).split(" ").filter(Boolean));
  if(!tokens.length) return [];
  return DATA.filter(d=>{
    const texto = limpiar([d.nombre,d.categoria,d.barrio,d.direccion].join(" "));
    return tokens.every(tok=>texto.includes(tok));
  });
}

/* CERCA */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* BOTONES */
$("#btnBuscar").onclick=async()=>{
  if(!LOADED)await cargarCSV();
  const q=$("#busqueda").value.trim();
  if(!q){estado("Escribí algo o usá el micrófono.");return;}
  const r=filtrar(q);
  render(r);
  estado("Buscar: "+r.length+" encontrado(s).");
};

$("#btnLimpiar").onclick=()=>{
  $("#busqueda").value="";
  render([]);
  $("#vacio").style.display="none";
  estado("Limpio. Nada en pantalla hasta que busques.");
};

$("#btnActualizar").onclick=async()=>{
  LOADED=false;
  await cargarCSV();
  render([]);
  $("#vacio").style.display="none";
};

$("#btnCerca").onclick=async()=>{
  if(!LOADED)await cargarCSV();
  if(!navigator.geolocation){estado("Geolocalización no disponible.");return;}
  estado("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords, radio=600;
    const lista=DATA.filter(d=>d.lat!=null&&d.lng!=null).map(d=>{
      const dist=haversine(latitude,longitude,d.lat,d.lng);
      return {...d,dist};
    }).filter(d=>d.dist<=radio).sort((a,b)=>a.dist-b.dist);
    render(lista);
    estado("Cerca: "+lista.length+" en "+radio+" m.");
  },()=>estado("No se pudo obtener la ubicación."));
};

$("#btnVoz").onclick=async()=>{
  if(!LOADED)await cargarCSV();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){estado("Tu navegador no admite reconocimiento de voz.");return;}
  const rec=new SR();rec.lang="es-ES";rec.start();estado("Escuchando…");
  rec.onresult=e=>{
    const txt=e.results[0][0].transcript;
    $("#busqueda").value=txt;
    const r=filtrar(txt);
    render(r);
    estado("Voz: '"+txt+"' → "+r.length+" resultado(s).");
  };
  rec.onerror=()=>estado("Error al escuchar.");
};

estado("Listo. No se cargan comercios hasta que lo pidas.");
</script>
</body>
</html>
