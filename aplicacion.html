<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerías y Servicios</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#0f1115;color:#e8ecf1;margin:0;text-align:center}
header{padding:14px;border-bottom:1px solid #1f2430}
h1{margin:0;font-size:20px}
main{max-width:900px;margin:auto;padding:20px}
input{padding:10px 12px;border-radius:8px;border:1px solid #273042;background:#0d0f14;color:#e8ecf1;width:70%}
button{padding:10px 14px;border-radius:10px;border:1px solid #273042;background:#10151e;color:#e8ecf1;cursor:pointer;margin:6px}
button:hover{border-color:#3a475e}
#resultado{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.card{background:#171a21;border:1px solid #232838;border-radius:14px;padding:10px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}
.empty{border:1px dashed #273042;border-radius:14px;padding:20px;margin-top:20px;color:#aab3c3}
footer{font-size:12px;color:#93a0b4;padding:10px;border-top:1px solid #1f2430}
</style>
</head>
<body>
<header><h1>Galerías y Servicios</h1></header>

<main>
  <p id="estado">Listo. No se cargan comercios hasta que lo pidas.</p>
  <input id="busqueda" type="text" placeholder="Escribí o hablá para buscar…">
  <div>
    <button id="btnBuscar">Buscar</button>
    <button id="btnVoz">🎤 Voz</button>
    <button id="btnCerca">Cerca</button>
    <button id="btnActualizar">Actualizar</button>
    <button id="btnLimpiar">Limpiar</button>
  </div>
  <section id="resultado"></section>
  <div id="vacio" class="empty" style="display:none;">Sin resultados.</div>
</main>

<footer>v3 • búsqueda por texto o voz • carga bajo demanda</footer>

<script>
const DATA_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRHgY8F6D3kqdlXoYMdG1qGxD4zEJ8qkE-mGbDhbv8vWuhA1-bhQ9dUoPq_hl8pL3w/pub?output=csv";

let DATA=[];
const estado=t=>{document.getElementById("estado").textContent=t;console.log(t);};

async function cargarCSV(){
  estado("Cargando CSV…");
  const r=await fetch(DATA_URL+"?nocache="+Date.now());
  const t=await r.text();
  const l=t.split(/\r?\n/).filter(x=>x.trim()!=="").map(a=>a.split(","));
  const cab=l.shift().map(h=>h.trim().toLowerCase());
  const idx=k=>cab.findIndex(h=>h.includes(k));
  DATA=l.map(c=>({
    nombre:c[idx("nombre")]||"",
    categoria:c[idx("categoria")]||"",
    barrio:c[idx("barrio")]||"",
    direccion:c[idx("direccion")]||"",
    lat:parseFloat(c[idx("lat")])||null,
    lng:parseFloat(c[idx("lng")])||null,
    imagen:c[idx("imagen")]||""
  }));
  estado("CSV cargado: "+DATA.length+" filas (no se muestran hasta que busques).");
}

function render(lista){
  const cont=document.getElementById("resultado");
  cont.innerHTML=lista.map(d=>`
  <div class="card">
    ${d.imagen?`<img src="${d.imagen}" alt="${d.nombre}" onerror="this.remove()">`:`<div style='height:150px;display:flex;align-items:center;justify-content:center;color:#7d8aa3;'>Sin imagen</div>`}
    <h3>${d.nombre}</h3>
    <p>${d.categoria||""} ${d.barrio?"· "+d.barrio:""}</p>
    <p>${d.direccion||""}</p>
  </div>`).join("");
  document.getElementById("vacio").style.display=lista.length?"none":"block";
}

function filtrar(q){
  const n=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return DATA.filter(d=>Object.values(d).join(" ").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(n));
}

document.getElementById("btnBuscar").onclick=()=>{
  const q=document.getElementById("busqueda").value.trim();
  if(!q){estado("Escribí algo o usá el micrófono.");return;}
  const r=filtrar(q);
  render(r);
  estado("Buscar: "+r.length+" encontrado(s).");
};

document.getElementById("btnLimpiar").onclick=()=>{
  document.getElementById("busqueda").value="";
  render([]);
  document.getElementById("vacio").style.display="none";
  estado("Limpio. Nada en pantalla hasta que busques.");
};

document.getElementById("btnActualizar").onclick=()=>{
  cargarCSV().then(()=>{render([]);document.getElementById("vacio").style.display="none";});
};

document.getElementById("btnCerca").onclick=()=>{
  if(!navigator.geolocation){estado("Geolocalización no disponible.");return;}
  estado("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    const R=6371000,toRad=g=>g*Math.PI/180;
    const lista=DATA.filter(d=>d.lat&&d.lng).map(d=>{
      const dLat=toRad(d.lat-latitude),dLon=toRad(d.lng-longitude);
      const a=Math.sin(dLat/2)**2+Math.cos(toRad(latitude))*Math.cos(toRad(d.lat))*Math.sin(dLon/2)**2;
      const dist=2*R*Math.asin(Math.sqrt(a));
      return {...d,dist};
    }).filter(d=>d.dist<=600).sort((a,b)=>a.dist-b.dist);
    render(lista);
    estado("Cerca: "+lista.length+" en 600 m.");
  },()=>estado("No se pudo obtener la ubicación."));
};

document.getElementById("btnVoz").onclick=()=>{
  if(!('webkitSpeechRecognition'in window)){estado("Tu navegador no admite reconocimiento de voz.");return;}
  const rec=new webkitSpeechRecognition();
  rec.lang="es-ES";
  rec.start();
  estado("Escuchando…");
  rec.onresult=e=>{
    const txt=e.results[0][0].transcript;
    document.getElementById("busqueda").value=txt;
    const r=filtrar(txt);
    render(r);
    estado("Voz: '"+txt+"' → "+r.length+" resultado(s).");
  };
  rec.onerror=()=>estado("Error al escuchar.");
};

cargarCSV();
</script>
</body>
</html>
