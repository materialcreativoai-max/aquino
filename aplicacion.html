<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aquí Nomás — DEMO (catálogo)</title>
<style>
:root{--pri:#0b5cff;}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f7f9fb;color:#0b1220}
.wrap{max-width:900px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:0 0 14px}
.box{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:14px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{flex:1;min-width:260px;padding:12px 14px;border:1px solid #cfd6e0;border-radius:12px;font-size:15px}
.btn{padding:10px 12px;border-radius:12px;border:1px solid var(--pri);background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.secondary{background:#fff;color:var(--pri)}
.btn.ghost{background:#fff;border-color:#cfd6e0;color:#0b1220}
.btn.mic{border:1px dashed var(--pri);background:#eef3ff}
.tiny{font-size:12px;color:#667}
.card{background:#f9fafc;border:1px solid #e6e9ee;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-inner{display:flex;align-items:center;gap:12px;width:100%}
.media{flex:0 0 80px;height:80px;display:flex;align-items:center;justify-content:center}
.thumb-ico{max-width:80px;max-height:80px;object-fit:contain;border-radius:10px;background:#eef1f6;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-body{flex:1;min-width:0;text-align:left;max-width:480px}
.title{font-weight:700;margin:0 0 4px}
.title span{font-weight:600;color:#555}
.meta{font-size:12px;color:#566;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;justify-content:flex-start}
@media (max-width:560px){
.media{flex-basis:56px;height:56px}
.thumb-ico{max-width:56px;max-height:56px;border-radius:8px}
.title{font-size:16px}
.card-body{font-size:14px;line-height:1.25;max-width:100%}
.actions .btn{padding:9px 12px}
}
.err{padding:8px 10px;background:#fff3f3;border:1px solid #ffd2d2;border-radius:10px;margin-bottom:12px;color:#7a1a1a}
.ok{padding:8px 10px;background:#eef9f1;border:1px solid #cfead8;border-radius:10px;margin-bottom:12px;color:#145a32}
</style>
</head>
<body>
<div class="wrap">
<h1>🏷️ Aquí Nomás — DEMO (catálogo)</h1>
<div id="status" class="ok" style="display:none"></div>
<div id="error" class="err" style="display:none"></div>
<div class="box">
  <div class="row">
    <input id="qall" class="input" placeholder="Ej: 'almorzar en gastronomix', 'arreglo de cierres en el centro'"/>
    <button id="micBtn" class="btn mic" title="Dictar por voz">🎤</button>
    <button id="goBtn" class="btn">Buscar</button>
    <button id="clearBtn" class="btn ghost">Limpiar</button>
    <button id="locBtn" class="btn secondary" title="Usar mi ubicación">📍 Cerca</button>
    <button id="refreshBtn" class="btn" title="Volver a leer el CSV">Actualizar datos</button>
  </div>
  <div class="tiny" id="gpsHint" style="margin-top:6px;display:none"></div>
</div>
<div id="results" class="box"></div>
</div>
